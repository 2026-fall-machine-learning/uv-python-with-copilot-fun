[project]
name = "uv-python-with-copilot-fun"
version = "0.1.0"
description = "A small uv-managed Python hello-world project."
readme = "README.md"
requires-python = "==3.9.25"
dependencies = [
    "pyfiglet>=1.0.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Require a trailing comma on every multiline call/collection/def. This rule
# conflicts with the formatter's own judgment about when to collapse a call
# back onto one line, so the standard workflow is: run `uv format` first (to
# settle line breaks), then `ruff check --fix` (to add the missing commas),
# then `uv format` again (idempotent from then on).
select = ["COM812"]
