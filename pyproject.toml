[project]
name = "uv-python-with-copilot-fun"
version = "0.1.0"
description = "A small uv-managed Python hello-world project."
readme = "README.md"
requires-python = "==3.9.25"
dependencies = [
    "pyfiglet>=1.0.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
